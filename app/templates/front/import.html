{% extends "base.html" %}
{% block title %}Excel 导入 · 短租箱 EIR{% endblock %}
{% block content %}
<div class="page-head"><h1>Excel 导入</h1></div>
<div class="card">
  <p class="muted">导入顺序：堆场信息 → 起租号登记 → 提箱登记。重复导入不会覆盖已有库存或已放箱记录。导入前自动备份数据库。</p>
  <form method="post" enctype="multipart/form-data" class="form">
    <label>数据类型
      <select name="sheet">
        <option value="yards">堆场信息</option>
        <option value="batches">起租号登记</option>
        <option value="pickups" selected>提箱登记</option>
      </select>
    </label>
    <label>选择 Excel 文件<input type="file" name="file" accept=".xlsx" required></label>
    <button type="submit" class="btn primary">导入</button>
  </form>
  <h3>下载导入模板</h3>
  <p>
    <a class="btn" href="{{ url_for('front.download_template', name='yards') }}">堆场信息模板</a>
    <a class="btn" href="{{ url_for('front.download_template', name='batches') }}">起租号登记模板</a>
    <a class="btn" href="{{ url_for('front.download_template', name='pickups') }}">提箱登记模板</a>
  </p>
</div>
{% endblock %}
