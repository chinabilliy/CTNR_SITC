{% extends "base.html" %}
{% block title %}系统设置 · 短租箱 EIR{% endblock %}
{% block content %}
<div class="page-head"><h1>系统设置</h1></div>
<div class="card">
  <form method="post" class="form">
    <label>EIR 号前缀<input name="eir_no_prefix" value="{{ vals.eir_no_prefix }}"></label>
    <label>单批库存不足时允许拆单<select name="allow_split">
      <option value="1" {{ 'selected' if vals.allow_split=='1' }}>允许</option>
      <option value="0" {{ 'selected' if vals.allow_split!='1' }}>不允许</option>
    </select></label>
    <label>允许对已打印的 EIR 再次打印<select name="allow_reprint">
      <option value="1" {{ 'selected' if vals.allow_reprint=='1' }}>允许（重印会再次累加次数）</option>
      <option value="0" {{ 'selected' if vals.allow_reprint!='1' }}>不允许（默认）</option>
    </select></label>

    <label style="margin-top:6px">界面主题（全站生效，不影响 EIR 打印样式）</label>
    <div class="theme-cards" id="theme-cards">
      {% for t in themes %}
      <label class="theme-card{{ ' selected' if vals.ui_theme==t.key }}" data-theme-card="{{ t.key }}">
        <input type="radio" name="ui_theme" value="{{ t.key }}" {{ 'checked' if vals.ui_theme==t.key }}>
        <span class="tc-preview">
          <span class="tc-side" style="background:{{ t.side }}"></span>
          <span class="tc-main" style="background:{{ t.page }}">
            <span class="tc-bar" style="background:{{ t.primary }};width:70%"></span>
            <span class="tc-bar" style="background:{{ t.primary }};opacity:.45;width:90%"></span>
            <span class="tc-bar" style="background:{{ t.primary }};opacity:.25;width:55%"></span>
          </span>
        </span>
        <span class="tc-name">{{ t.label }}</span>
      </label>
      {% endfor %}
    </div>

    <button type="submit" class="btn primary">保存</button>
  </form>
  <p class="muted small">当前流水：{{ vals.eir_seq_date }} / {{ vals.eir_seq }}</p>
</div>
{% endblock %}
{% block scripts %}
<script>
// 主题卡片：点选即时预览（改 html 的 data-theme），保存后全站持久生效
(function(){
  var cards = document.querySelectorAll('[data-theme-card]');
  cards.forEach(function(card){
    card.addEventListener('click', function(){
      var key = this.getAttribute('data-theme-card');
      document.documentElement.setAttribute('data-theme', key);
      cards.forEach(function(c){ c.classList.remove('selected'); });
      this.classList.add('selected');
      var radio = this.querySelector('input[type=radio]');
      if (radio) radio.checked = true;
    });
  });
})();
</script>
{% endblock %}
